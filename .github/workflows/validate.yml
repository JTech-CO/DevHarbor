name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build, policy, and Windows fixture integration checks
        shell: pwsh
        run: ./scripts/Validate.ps1 -WindowsIntegration
